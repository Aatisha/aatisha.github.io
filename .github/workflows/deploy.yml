# Builds the site and publishes it to GitHub Pages (aatishacyrill.com) on every push to master.
# The web versions of the media are made here from the originals in media/, and cached between runs,
# so only media that changed is re-encoded.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore built media
        uses: actions/cache@v4
        with:
          path: |
            .media-cache
            site/public/media
          key: media-${{ hashFiles('media/**', 'scripts/build-media.mjs', 'site.config.mjs', 'site/**/*.html', 'site/js/**', 'site/css/**') }}
          restore-keys: media-

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
